<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SGTD IIoT Hub — Overview</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <script src="assets/vendor/chart.umd.js"></script>
</head>
<body>
<script src="assets/js/icons.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  const content = renderLayout({
    pageId: 'dashboard',
    title: 'Operations Overview',
    crumb: 'SGTD · Industrial IoT Hub',
  });

  const s = summary();
  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi">
        <div class="ico-bg">${ICONS.cpu}</div>
        <div class="label">Connected Devices</div>
        <div class="value" id="kpi-online">${s.online} / ${s.total}</div>
        <div class="trend up">▲ 4.2% vs yesterday</div>
      </div>
      <div class="kpi">
        <div class="ico-bg">${ICONS.pulse}</div>
        <div class="label">Messages / minute</div>
        <div class="value" id="kpi-mpm">—</div>
        <div class="trend up">▲ 12.6% throughput</div>
      </div>
      <div class="kpi">
        <div class="ico-bg">${ICONS.signal}</div>
        <div class="label">Active Gateways</div>
        <div class="value">${s.gateways}</div>
        <div class="trend up">All facilities online</div>
      </div>
      <div class="kpi">
        <div class="ico-bg">${ICONS.bolt}</div>
        <div class="label">Open Alerts</div>
        <div class="value" id="kpi-alerts">${s.critical + s.warnings}</div>
        <div class="trend down">${s.critical} critical · ${s.warnings} warnings</div>
      </div>
    </div>

    <div class="section-title">
      <h2>Live Telemetry</h2>
      <div class="actions">
        <span class="pill active">1H</span>
        <span class="pill">6H</span>
        <span class="pill">24H</span>
        <span class="pill">7D</span>
      </div>
    </div>

    <div class="grid-12">
      <div class="card col-8">
        <h3>${ICONS.pulse} Throughput across protocols
          <span class="meta">messages / minute</span>
        </h3>
        <div class="chart-wrap"><canvas id="ch-throughput"></canvas></div>
      </div>
      <div class="card col-4">
        <h3>Protocol Distribution <span class="meta">live devices</span></h3>
        <div class="chart-wrap"><canvas id="ch-protocol"></canvas></div>
      </div>

      <div class="card col-8">
        <h3>Telemetry by Facility <span class="meta">avg readings/hour</span></h3>
        <div class="chart-wrap"><canvas id="ch-facility"></canvas></div>
      </div>
      <div class="card col-4">
        <h3>Device Health <span class="meta">live status</span></h3>
        <div class="chart-wrap"><canvas id="ch-health"></canvas></div>
      </div>

      <div class="card col-8">
        <h3>Live Activity Stream <span class="meta"><span class="live"><span class="dot"></span>STREAMING</span></span></h3>
        <div class="feed" id="feed"></div>
      </div>
      <div class="card col-4">
        <h3>Recent Alerts <span class="meta"><a href="alerts.html">View all →</a></span></h3>
        <div id="alert-list" style="display:flex;flex-direction:column;gap:10px;"></div>
      </div>

      <div class="card col-12">
        <h3>Top Talkers <span class="meta">last 15 minutes</span></h3>
        <table class="t">
          <thead>
            <tr>
              <th>Device</th><th>Facility</th><th>Protocol</th>
              <th>Type</th><th>Last reading</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="top-talkers"></tbody>
        </table>
      </div>
    </div>
  `;

  // Throughput chart
  const labels = lastNMinuteLabels(30);
  const mqttData = genSeries(30, 480, 60, 0.18);
  const loraData = genSeries(30, 120, 30, 0.22);
  const throughput = timeSeries(document.getElementById('ch-throughput'), labels, [
    { label: 'MQTT', data: mqttData },
    { label: 'LoRa', data: loraData },
  ]);

  // Protocol doughnut
  doughnut(document.getElementById('ch-protocol'),
    ['MQTT', 'LoRaWAN'],
    [s.mqtt, s.lora],
    ['#22d3ee', '#a78bfa']);

  // Facility bar
  barChart(document.getElementById('ch-facility'),
    FACILITIES.map(f => f.name.split(' — ')[0].split(' ').slice(0,2).join(' ')),
    FACILITIES.map(() => Math.floor(rand(800, 3200))),
    'Readings / hour');

  // Health doughnut
  const okCount = DEVICES.filter(d => d.status === 'ok').length;
  const warnCount = DEVICES.filter(d => d.status === 'warn').length;
  const dangerCount = DEVICES.filter(d => d.status === 'danger').length;
  doughnut(document.getElementById('ch-health'),
    ['Healthy', 'Warning', 'Critical'],
    [okCount, warnCount, dangerCount],
    ['#10b981', '#f59e0b', '#ef4444']);

  // Recent alerts
  const al = document.getElementById('alert-list');
  ALERTS.slice(0, 5).forEach(a => {
    const sevClass = a.severity === 'critical' ? 'danger' : a.severity === 'warning' ? 'warn' : 'info';
    const el = document.createElement('div');
    el.className = 'feed-item';
    el.innerHTML = `
      <div style="flex:1;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="chip ${sevClass}"><span class="d"></span>${a.severity.toUpperCase()}</span>
          <span class="src">${a.source}</span>
        </div>
        <div class="msg" style="margin-top:4px;">${a.message}</div>
        <div class="ts" style="margin-top:4px;">${fmtTime(a.ts)}</div>
      </div>
    `;
    al.appendChild(el);
  });

  // Top talkers table
  const tt = document.getElementById('top-talkers');
  DEVICES.slice().sort(() => Math.random() - 0.5).slice(0, 8).forEach(d => {
    const sevClass = d.status === 'danger' ? 'danger' : d.status === 'warn' ? 'warn' : 'ok';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="cell-mono">${d.id}</td>
      <td>${d.facilityName.split(' — ')[0]}</td>
      <td><span class="chip ${d.protocol==='MQTT'?'info':'ok'}"><span class="d"></span>${d.protocol}</span></td>
      <td>${d.type}</td>
      <td class="cell-mono">${d.value.toFixed(2)} ${d.unit}</td>
      <td><span class="chip ${sevClass}"><span class="d"></span>${d.status}</span></td>
      <td class="cell-mono" style="color:var(--text-mute);">${fmtTime(d.lastSeen)}</td>
    `;
    tt.appendChild(tr);
  });

  // Live stream
  const feed = document.getElementById('feed');
  let mpmCount = 0;
  let mpmWindow = [];
  setInterval(() => {
    mpmWindow.push(mpmCount); if (mpmWindow.length > 6) mpmWindow.shift();
    document.getElementById('kpi-mpm').textContent =
      Math.round(mpmWindow.reduce((a,b)=>a+b,0) / mpmWindow.length * 6).toLocaleString();
    mpmCount = 0;
  }, 10_000);

  BUS.addEventListener('telemetry', e => {
    const d = e.detail; mpmCount++;
    const item = document.createElement('div');
    item.className = 'feed-item';
    item.innerHTML = `
      <div class="ts">${new Date().toLocaleTimeString()}</div>
      <div style="flex:1;">
        <div><span class="src">${d.protocol==='MQTT' ? d.topic : 'devEUI:' + d.devEui}</span></div>
        <div class="msg">${d.id} · <strong>${d.value.toFixed(2)} ${d.unit}</strong>
          ${d.protocol==='LoRa' ? `· RSSI ${d.rssi} dBm · SNR ${d.snr} dB` : `· QoS ${d.qos}`}
        </div>
      </div>
    `;
    feed.prepend(item);
    while (feed.childElementCount > 22) feed.lastElementChild.remove();

    // Update throughput chart (rolling)
    if (d.protocol === 'MQTT') mqttData[mqttData.length-1]++;
    else loraData[loraData.length-1]++;
  });

  // Roll throughput minute window
  setInterval(() => {
    labels.shift(); labels.push(new Date().getMinutes().toString().padStart(2,'0'));
    mqttData.shift(); mqttData.push(450 + Math.floor(rand(-60, 80)));
    loraData.shift(); loraData.push(115 + Math.floor(rand(-25, 40)));
    throughput.update('none');
  }, 8_000);

  BUS.start();
</script>
</body>
</html>

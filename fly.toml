app = "sgtd-iiot-hub"
primary_region = "cdg"

[build]
  builder = "heroku/builder:24"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "sgtd_data"
  destination = "/app/data"

[[services]]
  internal_port = 1883
  protocol = "tcp"
  [[services.ports]]
    port = 1883

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="SGTD">
  <defs>
    <linearGradient id="sgtdMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="sgtdGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Hex industrial mark -->
  <g transform="translate(4,6)">
    <polygon points="26,2 48,14 48,38 26,50 4,38 4,14"
             fill="none" stroke="url(#sgtdMark)" stroke-width="2.2"/>
    <polygon points="26,12 39,19 39,33 26,40 13,33 13,19"
             fill="url(#sgtdGlow)" opacity="0.18"/>
    <!-- Network nodes -->
    <circle cx="26" cy="16" r="2.6" fill="#22d3ee"/>
    <circle cx="17" cy="22" r="2.2" fill="#7dd3fc"/>
    <circle cx="35" cy="22" r="2.2" fill="#7dd3fc"/>
    <circle cx="17" cy="30" r="2.2" fill="#7dd3fc"/>
    <circle cx="35" cy="30" r="2.2" fill="#7dd3fc"/>
    <circle cx="26" cy="36" r="2.6" fill="#22d3ee"/>
    <!-- Links -->
    <g stroke="#67e8f9" stroke-width="1" opacity="0.85">
      <line x1="26" y1="16" x2="17" y2="22"/>
      <line x1="26" y1="16" x2="35" y2="22"/>
      <line x1="17" y1="22" x2="17" y2="30"/>
      <line x1="35" y1="22" x2="35" y2="30"/>
      <line x1="17" y1="30" x2="26" y2="36"/>
      <line x1="35" y1="30" x2="26" y2="36"/>
      <line x1="17" y1="22" x2="35" y2="30"/>
      <line x1="35" y1="22" x2="17" y2="30"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(70,0)" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">
    <text x="0" y="34" font-size="28" fill="#e6f6ff" letter-spacing="2">SGTD</text>
    <text x="0" y="52" font-size="9" fill="#7dd3fc" letter-spacing="3.5" font-weight="600">INDUSTRIAL IoT HUB</text>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SGTD IIoT Hub — Analytics</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <script src="assets/vendor/chart.umd.js"></script>
</head>
<body>
<script src="assets/js/icons.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  const content = renderLayout({
    pageId: 'analytics',
    title: 'Analytics & Insights',
    crumb: 'SGTD · Insights',
  });

  content.innerHTML = `
    <div class="section-title">
      <h2>Operational analytics across the SGTD fleet</h2>
      <div class="actions">
        <span class="pill">24H</span>
        <span class="pill active">7D</span>
        <span class="pill">30D</span>
        <span class="pill">90D</span>
        <button class="btn ghost">${ICONS.download} Export PDF</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="ico-bg">${ICONS.bolt}</div>
        <div class="label">Total Energy</div>
        <div class="value">142.8 MWh</div>
        <div class="trend down">▼ 3.1% vs last week</div>
      </div>
      <div class="kpi"><div class="ico-bg">${ICONS.pulse}</div>
        <div class="label">Avg Uptime</div>
        <div class="value">99.62%</div>
        <div class="trend up">▲ 0.18%</div>
      </div>
      <div class="kpi"><div class="ico-bg">${ICONS.signal}</div>
        <div class="label">Data Volume</div>
        <div class="value">38.4 GB</div>
        <div class="trend up">▲ 11.4%</div>
      </div>
      <div class="kpi"><div class="ico-bg">${ICONS.cpu}</div>
        <div class="label">Avg Latency</div>
        <div class="value">84 ms</div>
        <div class="trend up">▼ 6 ms</div>
      </div>
    </div>

    <div class="grid-12" style="margin-top:18px;">
      <div class="card col-8">
        <h3>Energy consumption — past 7 days</h3>
        <div class="chart-wrap lg"><canvas id="ch-energy"></canvas></div>
      </div>
      <div class="card col-4">
        <h3>Operational efficiency</h3>
        <div class="chart-wrap lg"><canvas id="ch-radar"></canvas></div>
      </div>

      <div class="card col-6">
        <h3>Sensor categories <span class="meta">readings/day</span></h3>
        <div class="chart-wrap"><canvas id="ch-cats"></canvas></div>
      </div>
      <div class="card col-6">
        <h3>Temperature heatmap <span class="meta">facility × hour-of-day</span></h3>
        <div id="heatmap" style="display:grid;grid-template-columns:120px repeat(24,1fr);gap:2px;font-size:10px;"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--text-mute);">
          <span>cool</span>
          <div style="flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#0891b2,#22d3ee,#10b981,#f59e0b,#ef4444);"></div>
          <span>hot</span>
        </div>
      </div>

      <div class="card col-12">
        <h3>Top consuming facilities <span class="meta">kWh, last 24h</span></h3>
        <div class="chart-wrap"><canvas id="ch-top"></canvas></div>
      </div>

      <div class="card col-12">
        <h3>Predictive maintenance signals <span class="meta">ML anomaly scores</span></h3>
        <table class="t">
          <thead><tr><th>Device</th><th>Facility</th><th>Type</th><th>Score</th><th>Trend</th><th>Recommendation</th></tr></thead>
          <tbody>
            ${[1,2,3,4,5,6].map(i => {
              const d = DEVICES[Math.floor(Math.random()*DEVICES.length)];
              const score = (Math.random()*0.6 + 0.35).toFixed(2);
              const sev = score > 0.85 ? 'danger' : score > 0.6 ? 'warn' : 'ok';
              return `<tr>
                <td class="cell-mono">${d.id}</td>
                <td>${d.facilityName.split(' — ')[0]}</td>
                <td>${d.type}</td>
                <td><span class="chip ${sev}"><span class="d"></span>${score}</span></td>
                <td><canvas data-spark style="height:30px;width:120px;"></canvas></td>
                <td style="color:var(--text-dim);">${score > 0.85 ? 'Schedule inspection within 48h' : score > 0.6 ? 'Monitor closely · order parts' : 'Within nominal range'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Energy chart
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  timeSeries(document.getElementById('ch-energy'), days, [
    { label: 'Terminal A', data: [18.2, 19.4, 21.6, 20.1, 22.5, 19.8, 21.0] },
    { label: 'Doraleh',    data: [15.4, 14.9, 16.2, 17.8, 18.1, 16.6, 15.9] },
    { label: 'Damerjog',   data: [12.1, 12.8, 13.5, 13.2, 14.1, 12.9, 13.0] },
    { label: 'Ali Sabieh', data: [9.6, 10.2, 11.1, 10.8, 11.4, 10.9, 10.4] },
  ]);

  // Radar
  radar(document.getElementById('ch-radar'),
    ['Uptime','Throughput','Latency','Coverage','Energy eff.','Alert resp.'],
    [
      { label: 'Current week', data: [98, 88, 82, 91, 76, 84] },
      { label: 'Previous',     data: [94, 80, 75, 87, 72, 78] },
    ]);

  // Categories
  barChart(document.getElementById('ch-cats'),
    DEVICE_TYPES.map(t => t.type),
    DEVICE_TYPES.map(() => Math.floor(rand(1200, 8400))),
    'Readings', true);

  // Top facilities
  barChart(document.getElementById('ch-top'),
    FACILITIES.map(f => f.name.split(' — ')[0]),
    [1842, 1610, 1420, 980, 1240]);

  // Heatmap
  const hm = document.getElementById('heatmap');
  // header
  hm.innerHTML = '<div></div>' +
    Array.from({length:24}, (_,h) => `<div style="text-align:center;color:var(--text-mute);">${String(h).padStart(2,'0')}</div>`).join('');
  FACILITIES.forEach(f => {
    hm.innerHTML += `<div style="color:var(--text-dim);font-weight:600;">${f.name.split(' — ')[0]}</div>`;
    for (let h = 0; h < 24; h++) {
      const t = 24 + Math.sin((h - 13) / 4) * 10 + Math.random()*4 + (f.id === 'PLT-04' ? 6 : 0);
      const norm = Math.max(0, Math.min(1, (t - 18) / 22));
      const color = norm < 0.25 ? '#0891b2'
                  : norm < 0.45 ? '#22d3ee'
                  : norm < 0.6  ? '#10b981'
                  : norm < 0.78 ? '#f59e0b'
                  : '#ef4444';
      hm.innerHTML += `<div title="${t.toFixed(1)}°C" style="height:22px;background:${color};opacity:${0.45 + norm*0.55};border-radius:3px;"></div>`;
    }
  });

  // Sparklines
  document.querySelectorAll('[data-spark]').forEach(c => {
    sparkline(c, genSeries(20, 0.5, 0.4, 0.3));
  });

  BUS.start();
</script>
</body>
</html>
